  }
  function menuScene(s) {
    const n = cartCount(s);
    return `<div class="kitch-page kitch-page--poster">
      ${brand(s)}${strip(s)}${DOM.hero}${DOM.tabs}${DOM.head}<section class="pm-root" aria-label="Pesi Massimi"><div class="pm-list">${DOM.cards}</div></section>
      ${n ? `<div class="kitch-bottom-spacer"></div><div class="kitch-bottom-bar"><div class="kitch-bottom-card kb-wrap"><button type="button" class="kitch-btn-vai kb-ticket" data-act="openCart"><span>${n} · Vai alla cassa</span><span>${eur(cartTotal(s)).replace(' ', ' ')}</span></button></div></div>` : ''}
      ${s.cats ? catsPanel(s) : ''}
      ${s.cartOpen ? '<div class="kitch-backdrop" data-act="closeCart"></div>' + drawer(s) : ''}
    </div>`;
  }

  // ---------- sacco ----------
  function drawer(s) {
    const lines = cartLines(s);
    const total = cartTotal(s), food = cartFood(s);
    const v = availableVoucher(s);
    const applied = s.applied && v && canRedeem(s);
    const pay = total - (applied ? RULES.VOUCHER : 0);
    const rows = lines.map((l) => `<div class="kitch-drawer-row"><div class="kitch-drawer-row-img"><img alt="${esc(l.name)}" class="kitch-drawer-row-photo" src="${l.img}"></div><div class="kitch-drawer-row-content"><div class="kitch-drawer-row-name">${esc(l.name.toUpperCase())}</div>${s.member ? `<div class="fc-row-note">${l.food ? 'food · conta per il Club' : 'da bere · non conta'}</div>` : ''}</div><div class="kitch-drawer-row-price">${eur(l.price * l.q)}</div><div class="kitch-drawer-row-controls"><div class="kitch-qty-pill"><button class="kitch-qty-btn" data-dec="${l.k}" aria-label="Togli uno: ${esc(l.name)}">−</button><span class="kitch-qty-num">${l.q}</span><button class="kitch-qty-btn" data-inc="${l.k}" aria-label="Aggiungi uno: ${esc(l.name)}">+</button></div></div></div>`).join('');
    const hasBeer = lines.some((l) => l.k === 'helles');
    const pairing = hasBeer ? '' : `<div class="kitch-pairing-banner"><div class="kitch-pairing-copy"><span class="kitch-pairing-label">CI STA BENE UNA BIRRA?</span><span class="kitch-pairing-name">KEILER HELLES · VAI SUL SICURO</span></div><button type="button" class="kitch-pairing-add" data-inc="helles">+6,00&nbsp;€</button></div>`;

    // riga BUONO
    let vrow = '';
    const expiredNotice = s.vouchers.find((x) => x.status === 'expired' && x.notice);
    if (s.member && v) {
      if (canRedeem(s)) {
        vrow = `<div class="fc-cart-voucher${applied ? ' fc-cart-voucher--on' : ''}" data-testid="fc-cart-voucher">
          <div><div class="fc-cart-voucher-title">${applied ? 'Buono applicato' : 'Hai un buono da 5 €'}</div>
          <div class="fc-cart-voucher-sub">food <b>${eur(food)}</b> · minimo ${RULES.REDEEM_MIN} € ✓${applied ? ' · si consuma quando l’ordine è pagato' : ' · scade il ' + v.expires}</div></div>
          <button type="button" class="fc-apply${applied ? ' fc-apply--off' : ''}" data-act="toggleVoucher" aria-pressed="${applied}">${applied ? 'TOGLI' : 'USALO'}</button></div>`;
      } else {
        const miss = RULES.REDEEM_MIN - food;
        const pct = Math.round((food / RULES.REDEEM_MIN) * 100);
        const sug = lines.some((l) => l.k === 'patate') ? 'mortazza' : 'patate';
        vrow = `<div class="fc-cart-voucher fc-cart-voucher--low" data-testid="fc-cart-voucher">
          <div><div class="fc-cart-voucher-title">Buono da 5 €: quasi</div>
          <div class="fc-cart-voucher-sub">food <b>${eur(food)}</b> su ${RULES.REDEEM_MIN} €: ti mancano <b class="fc-yellow">${eur(miss)}</b>. Le bevande non contano.</div></div>
          <button type="button" class="fc-apply" disabled aria-disabled="true">USALO</button>
          <div class="fc-bar" role="img" aria-label="Food ${pct}% della soglia"><i style="width:${pct}%"></i></div>
          <div class="fc-suggest"><span>${P[sug].name}<small>${sug === 'patate' ? 'contorno · sblocca il buono' : 'cicchetto · sblocca il buono'}</small></span><button type="button" class="kitch-pairing-add" data-inc="${sug}">+${eur(P[sug].price)}</button></div></div>`;
      }
    } else if (s.member && expiredNotice) {
      vrow = `<div class="fc-cart-voucher fc-cart-voucher--low"><div><div class="fc-cart-voucher-title">Il tuo buono è scaduto</div><div class="fc-cart-voucher-sub">Era valido fino al ${expiredNotice.expires}. La tessera di adesso riparte: questo ordine può fare timbro.</div></div><button type="button" class="fc-apply fc-apply--off" data-act="dismissExpired" aria-label="Ok, chiudi avviso">OK</button></div>`;
    }
    // riga TIMBRO
    const f = forecast(s);
    let srow = '';
    if (f) {
      const map = ({
        ok: () => [`Questo ordine fa timbro`, `${f.n === 2 ? 'È il secondo: sblocchi il buono da 5 €' : 'Timbro ' + f.n + ' di 2'} appena il pagamento è confermato.`],
        low: () => [`Niente timbro, per ora`, `Il food è ${eur(food)}: per il timbro servono ${RULES.VISIT_MIN} € di food (mancano ${eur(f.missing)}).`],
        same: () => [`Timbro di stasera già preso`, `Conta una visita per serata: il prossimo timbro da un’altra sera.`],
        nofood: () => [`Solo bevande`, `Il Club conta solo il food.`],
      })[f.kind]();
      srow = `<div class="fc-cart-stamp">${stampEl(f.kind === 'ok' ? 'pending' : '', '', true).replace('fc-stamp-col', 'x')}<div><b>${map[0]}</b>${map[1]}</div></div>`;
    } else if (!s.member) {
      srow = `<div class="fc-cart-stamp" style="justify-content:space-between"><div>Hai la tessera del <b style="display:inline;font-size:18px">Food Club</b>?</div><button type="button" class="fc-link" data-go="join1">Entra</button></div>`;
    }
    const ready = `${esc(s.name)}, il Tricheco approva: si parte! 🦭`;
    const counterSub = applied ? 'il banco vede già lo sconto' : 'ti diamo un codice, paghi in cassa';
    return `<div class="kitch-drawer" role="dialog" aria-modal="true" aria-label="Il tuo sacco"><div class="kitch-drawer-handle"></div><div class="kitch-drawer-header"><div class="kitch-drawer-title">IL TUO SACCO</div><button class="kitch-drawer-close" data-act="closeCart" aria-label="Chiudi il sacco">×</button></div>
      <div class="kitch-drawer-body"><div class="kitch-drawer-items-list">${rows}</div>${pairing}
      <section class="cx" aria-label="Chiudi l'ordine">
        <!-- Righe Club DENTRO .cx: il footer sticky di pagamento può restare in vista solo dentro .cx -->
        ${vrow || srow ? `<div class="fc-cx-club">${vrow}${srow}</div>` : ''}
        <div class="cx-block cx-name"><label class="cx-title" for="nm">COME TI CHIAMI?</label><p class="cx-help">Ti chiamiamo così quando è pronto.</p><div class="cx-name-row"><input id="nm" class="cx-name-input cx-name-input--ok" value="${esc(s.name)}" maxlength="24" type="text"></div></div>
        <div class="cx-block"><div class="cx-title">DOVE LO MANGI?</div><div class="cx-where" role="group"><button type="button" aria-pressed="true" class="cx-where-btn cx-where-btn--on"><span class="cx-where-text"><span class="cx-where-title">MANGIO QUI</span><span class="cx-where-sub">ti chiamiamo</span></span></button><button type="button" aria-pressed="false" class="cx-where-btn"><span class="cx-where-text"><span class="cx-where-title">PORTO VIA</span><span class="cx-where-sub">impacchettiamo</span></span></button></div></div>
        <div class="cx-footer"><div role="group" aria-labelledby="cx-pay-label"><div class="cx-pay-head"><span class="cx-title" id="cx-pay-label">COME PAGHI?</span><span class="cx-total" data-testid="checkout-total"><small>TOTALE</small>${eur(pay)}</span></div>
          ${applied ? `<span class="fc-total-strike"><s>${eur(total)}</s><b>buono Club −5,00 €</b></span>` : ''}
          <div class="cx-status cx-status--ready" aria-live="polite">${ready}</div>
          <div class="cx-pay-grid"><button type="button" class="cx-pay" data-pay="online"><span class="cx-pay-text"><span class="cx-pay-title">PAGO ORA</span><span class="cx-pay-sub">dal telefono, va dritto in cucina</span></span>${ARROW}</button><button type="button" class="cx-pay" data-pay="counter"><span class="cx-pay-text"><span class="cx-pay-title">PAGO AL BANCO</span><span class="cx-pay-sub">${counterSub}</span></span>${ARROW}</button></div></div></div>
      </section></div></div>`;
  }

  // ---------- STATO ORDINE ----------
  function statusScene(s) {
    const o = s.order;
    if (!o) return `<div class="ost-page">${'<div class="ost-topbar"><button class="ost-topbar-back" data-go="menu">←</button><span class="ost-topbar-title">STATO ORDINE</span><span class="ost-topbar-bell">🔔</span></div>'}<div style="padding:60px 20px;text-align:center"><h2 class="ost-empty-title">Nessun ordine trovato</h2></div></div>`;
    const banner = {
      pcp: { cls: 'ost-status-banner--received', style: 'background:#c8960a;box-shadow:0 4px 16px rgba(200,150,10,0.33)', label: 'IN ATTESA DI PAGAMENTO', sub: `Mostra il codice in cassa: da pagare <b>${eur(o.total)}</b>${o.discount ? ' (buono Club già scalato)' : ''}.`, chip: 'Da pagare' },
      pop: { cls: 'ost-status-banner--received', style: 'background:#c8960a', label: 'PAGAMENTO ONLINE IN CORSO', sub: 'Completa il pagamento.', chip: 'Da pagare' },
      paid: { cls: 'ost-status-banner--received', style: '', label: 'ORDINE RICEVUTO', sub: 'Abbiamo ricevuto il tuo ordine. La cucina lo prenderà in carico a breve.', chip: 'Ricevuto' },
      cancelled: { cls: 'ost-status-banner--cancelled', style: '', label: 'ORDINE ANNULLATO', sub: 'L’ordine non è stato pagato ed è stato annullato. Non ti abbiamo addebitato nulla.', chip: 'Annullato' },
    }[o.status];
    const items = o.lines.map((l) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0"><span>${l.q}× ${esc(l.name)}</span><span>${eur(l.price * l.q)}</span></div>`).join('');
    const summary = `<div class="ost-info-grid" style="margin:0 20px 20px"><div class="ost-info-grid-header">IL TUO ORDINE</div><div style="padding:8px 14px 12px;font-size:14px">${items}
      ${o.discount ? `<div style="display:flex;justify-content:space-between;padding:6px 0;color:#ffc83d;font-weight:700"><span>Buono Club ${o.voucher}</span><span>−${eur(o.discount)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding:8px 0 0;border-top:1px solid rgba(245,234,216,.15);font-weight:800"><span>${o.status === 'pcp' ? 'DA PAGARE AL BANCO' : o.status === 'cancelled' ? 'TOTALE (annullato)' : 'TOTALE'}</span><span>${eur(o.total)}</span></div></div></div>`;
    const sim = o.status === 'pcp' ? `<div class="proto-sim"><strong>Simulazione · non fa parte dell’app</strong>Cosa fa lo staff in cassa:<br><button data-act="staffPaid">Lo staff segna PAGATO</button><button data-act="staffCancel">Ordine non pagato → annullato</button></div>`
      : o.status === 'pop' ? `<div class="proto-sim"><strong>Simulazione</strong><button data-go="sumup">Vai al pagamento SumUp</button></div>`
      : (o.status === 'paid' && s.member) ? `<div class="proto-sim"><strong>Simulazione</strong><button data-act="nextNight">Passa a un’altra sera (+7 giorni)</button><button data-go="tessera">Apri la tessera</button><button data-go="buoni">Apri i buoni</button></div>` : '';
    return `<div class="ost-page notranslate">
      <div class="ost-topbar"><button class="ost-topbar-back" aria-label="Torna al menu" data-go="menu">←</button><span class="ost-topbar-title">STATO ORDINE</span><span class="ost-topbar-bell">🔔</span></div>
      <div class="ost-codes-strip"><div class="ost-codes-chip"><span class="ost-codes-chip-code">${o.code}</span><span class="ost-codes-chip-status">${banner.chip}</span></div></div>
      <div class="ost-orders-stack"><div class="ost-order-block ost-order-card">
        <div class="ost-status-banner ${banner.cls}" style="${banner.style}"><div class="ost-status-banner-dot"></div><div class="ost-status-banner-content"><div class="ost-greeting">Ciao ${esc(s.name)}! 🦭</div><div class="ost-order-code-big">${o.code}</div><div class="ost-status-banner-label">${banner.label}</div><div class="ost-status-banner-sub">${banner.sub}</div></div></div>
        ${clubCard(s, o)}
        ${summary}
      </div></div>${sim}</div>`;
  }
  function clubCard(s, o) {
    const head = (k, t, em) => `<div class="fc-label">${k}</div><div class="fc-card-title" style="margin-top:4px">${t}${em ? ` <em>${em}</em>` : ''}</div>`;
    if (!s.member) {
      if (o.status === 'cancelled' || o.food <= 0) return '';
      const counts = o.food >= RULES.VISIT_MIN;
      const t = !counts ? ['Questo ordine non conta', 'ma il prossimo sì.'] : o.status === 'paid' ? ['Questa visita', 'conta già.'] : ['Questa visita', 'può contare.'];
      const sub = !counts ? `Il Club conta ordini con almeno ${RULES.VISIT_MIN} € di food.`
        : o.status === 'paid' ? '2 visite food in 30 giorni = 5 € di buono sul prossimo ordine.'
        : 'Conta appena paghi al banco. 2 visite food in 30 giorni = 5 € di buono.';
      return `<div class="fc-scope"><div class="fc-status-card">${head('Walrus Food Club · gratis', t[0], t[1])}<p class="fc-p">${sub}</p>
        <div class="fc-stamps">${stampEl(counts ? (o.status === 'paid' ? 'ok' : 'pending') : '', 'STASERA', true)}${stampEl('', 'LA PROSSIMA', true)}</div>
        ${cta('ENTRA NEL CLUB', 'gratis, col numero di telefono', 'joinFromStatus')}
        <button type="button" class="fc-link fc-link--muted" data-act="notNow">Non ora</button></div></div>`;
    }
    if (o.status === 'cancelled') {
      const parts = [];
      if (o.voucher) parts.push(`Il buono da 5 € è tornato nel portafoglio, sempre valido fino al <b>${s.vouchers.find((x) => x.code === o.voucher)?.expires}</b>.`);
      if (o.stamp === 'ok') parts.push('Il timbro non è stato assegnato: conta solo un ordine pagato.');
      return `<div class="fc-scope"><div class="fc-status-card fc-status-card--neutral">${head('Food Club', 'Niente di perso.')}<p class="fc-p">${parts.join(' ')}</p>${o.voucher ? cta('VEDI I BUONI', '', 'goBuoni') : ''}</div></div>`;
    }
    const resv = o.voucher ? `<div class="fc-cart-stamp fc-resv"><span class="fc-chip">${o.status === 'paid' ? 'USATO' : 'RISERVATO'}</span><div>${o.status === 'paid' ? 'Buono da 5 € usato su questo ordine.' : 'Buono da 5 € riservato: si consuma solo quando paghi. Se l’ordine viene annullato, torna nel portafoglio.'}</div></div>` : '';
    if (o.stamp === 'low') return `<div class="fc-scope"><div class="fc-status-card fc-status-card--neutral">${head('Food Club', 'Niente timbro', 'stavolta.')}<p class="fc-p">Food di questo ordine: <b>${eur(o.food)}</b>. Per il timbro servono almeno ${RULES.VISIT_MIN} € di food: le bevande non contano.</p>${cardStamps(s, true)}${resv}</div></div>`;
    if (o.stamp === 'same') return `<div class="fc-scope"><div class="fc-status-card fc-status-card--neutral">${head('Food Club', 'Timbro di stasera', 'già preso.')}<p class="fc-p">Conta una visita per serata (la serata finisce alle 06:00). Il prossimo timbro arriva da un’altra sera.</p>${cardStamps(s, true)}${resv}</div></div>`;
    if (o.status === 'paid' && o.unlocked) {
      const v = s.vouchers[0];
      const st = (s.lastCard || []).map((x, i) => stampEl('ok', `<b>${x.date}</b>`, true)).join('');
      return `<div class="fc-scope"><div class="fc-status-card fc-status-card--ok">${head('Food Club · tessera completata', 'Buono da 5 €', 'sbloccato!')}<div class="fc-stamps">${st}</div><p class="fc-p">Lo usi sul prossimo ordine food da almeno ${RULES.REDEEM_MIN} €, entro il <b>${v.expires}</b>.</p>${cta('VEDI IL BUONO', '', 'goBuoni')}${resv}</div></div>`;
    }
    if (o.stamp === 'ok') {
      const paid = o.status === 'paid';
      return `<div class="fc-scope"><div class="fc-status-card${paid ? ' fc-status-card--ok' : ''}">${head('Food Club', paid ? '+1 timbro' : 'Timbro in attesa', paid ? 'sulla tessera.' : '')}<p class="fc-p">${paid ? 'Visita contata. Ancora una visita, un’altra sera, per il buono da 5 €.' : 'Conta appena paghi al banco: lo staff conferma il pagamento e il timbro diventa pieno.'}</p>${cardStamps(s, true)}${resv}</div></div>`;
    }
    return resv ? `<div class="fc-scope"><div class="fc-status-card">${head('Food Club', 'Buono')}${resv}</div></div>` : '';
  }

  // ---------- CLUB: landing non iscritto ----------
  function clubIntro(s) {
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Food Club')}
      <header class="kp-head fc-head"><div class="kp-kicker">Walrus Melegnano · gratis</div><h1 class="kp-title">FOOD <em>CLUB.</em></h1><p class="kp-sub">Entra nella famiglia dei trichechi: due visite food, un buono da 5 € sul prossimo panino.</p></header>
      <div class="fc-card"><div class="fc-card-head"><span class="fc-card-title">2 visite = <em>5 €</em></span></div>${cardStamps({ stamps: [] }, false)}<div class="fc-small" style="text-align:center">La tessera parte col tuo primo ordine food.</div></div>
      <ol class="fc-steps">
        <li><span class="fc-step-n">1</span><div><b>Ordina dal QR</b><span>Almeno ${RULES.VISIT_MIN} € di food, pagato online o al banco.</span></div></li>
        <li><span class="fc-step-n">2</span><div><b>Torna un’altra sera</b><span>Entro 30 giorni dalla prima visita. Conta una visita per serata.</span></div></li>
        <li><span class="fc-step-n">3</span><div><b>5 € sul prossimo ordine</b><span>Lo usi nel sacco su un ordine food da almeno ${RULES.REDEEM_MIN} €. Vale 30 giorni.</span></div></li>
      </ol>
      <div class="fc-cta-row">${cta('ENTRA NEL CLUB', 'gratis · solo il numero di telefono', 'goJoin')}</div>
      <div class="fc-wrap"><button type="button" class="fc-link fc-link--muted" data-go="menu">Ordina senza iscriverti</button>
      <p class="fc-small">Valido solo al Walrus di Melegnano e solo sul food ordinato con Walbox. Gli ordini fatti direttamente dallo staff in cassa non contano.</p></div></div>`;
  }

  // ---------- ISCRIZIONE ----------
  const prog = (n) => `<div class="fc-progress" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
  function join1(s) {
    const e = s.joinErr;
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Iscrizione', s.joinFrom === 'status' ? 'status' : 'club')}${prog(1)}
      <header class="kp-head fc-head fc-head--sm"><div class="kp-kicker">1 di 3</div><h1 class="kp-title">IL TUO <em>NUMERO</em></h1><p class="kp-sub">Ti mandiamo un codice via SMS. Niente password, niente app da scaricare.</p></header>
      <div class="cx-block" style="padding-top:10px"><label class="cx-title" for="ph">CELLULARE</label>
        <div class="fc-phone" style="margin-top:8px"><span class="fc-prefix">+39</span><input id="ph" class="cx-name-input" inputmode="tel" autocomplete="tel-national" placeholder="333 123 4567" value="${esc(s.phone)}" aria-invalid="${e === 'phone'}" aria-describedby="ph-err"></div>
        <div id="ph-err" aria-live="polite">${e === 'phone' ? '<div class="fc-error" role="alert">Controlla il numero: servono 9 o 10 cifre.</div>' : ''}</div>
        <label class="fc-check" style="margin-top:10px"><input type="checkbox" id="ck-priv" ${s.privacy ? 'checked' : ''}><span class="fc-check-text">Ho letto l’<u>informativa privacy</u> del Food Club <small>Obbligatorio. Usiamo il numero per la tessera e i buoni.</small></span></label>
        ${e === 'privacy' ? '<div class="fc-error" role="alert">Per entrare nel Club serve l’ok all’informativa.</div>' : ''}
        <label class="fc-check"><input type="checkbox" id="ck-mkt" ${s.marketing ? 'checked' : ''}><span class="fc-check-text">Voglio ricevere promo e novità del Walrus <small>Facoltativo. Solo notifiche nell’app e messaggi qui dentro. Puoi toglierlo quando vuoi.</small></span></label>
      </div>
      <div class="fc-cta-row" style="padding-top:4px">${cta('MANDAMI IL CODICE', 'SMS gratuito', 'sendCode')}</div>
      <div class="fc-wrap"><button type="button" class="fc-link fc-link--muted" data-go="menu">Puoi ordinare anche senza</button></div></div>`;
  }
  function join2(s) {
    const err = s.otpErr;
    const boxes = [0, 1, 2, 3, 4, 5].map((i) => `<input inputmode="numeric" maxlength="1" ${i === 0 ? 'autocomplete="one-time-code"' : ''} aria-label="Cifra ${i + 1}" value="${err ? '0' : ''}" data-otp="${i}">`).join('');
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Iscrizione', 'join1')}${prog(2)}
      <header class="kp-head fc-head fc-head--sm"><div class="kp-kicker">2 di 3</div><h1 class="kp-title">IL <em>CODICE</em></h1><p class="kp-sub">L’abbiamo mandato al +39 ••• ••• ${esc(s.phone.replace(/\D/g, '').slice(-4) || '4821')}.</p><button type="button" class="fc-link" data-go="join1">Numero sbagliato? Modifica</button></header>
      <div class="cx-block" style="padding-top:10px"><div class="fc-otp${err ? ' fc-otp--err' : ''}" role="group" aria-label="Codice a 6 cifre">${boxes}</div>
        <div aria-live="polite">${err ? '<div class="fc-error" role="alert">Codice sbagliato. Riprova: ti restano 2 tentativi.</div>' : ''}</div>
        <p class="cx-help" style="margin-top:12px">Non arriva? <span id="otp-timer">Puoi richiederlo di nuovo tra 0:42</span></p>
        <p class="fc-small">Prototipo: qualsiasi codice va bene, <b>000000</b> mostra l’errore.</p></div>
      <div class="fc-cta-row">${cta('VERIFICA', '', 'verify')}</div></div>`;
  }
  function join3(s) {
    const o = s.order;
    const assoc = s.joinFrom === 'status' && o && o.status !== 'cancelled';
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Iscrizione', 'menu')}${prog(3)}
      <header class="kp-head fc-head"><div class="kp-kicker">3 di 3 · fatto</div><h1 class="kp-title">CI SEI, <em>${esc(s.name.toUpperCase())}.</em></h1><p class="kp-sub">Sei nel Walrus Food Club. 🦭</p></header>
      ${assoc ? `<div class="fc-card" style="border-style:solid"><div class="fc-label">Ordine di stasera</div><div class="fc-card-head" style="margin-top:6px"><span class="fc-card-title">${o.code} · <em>${eur(o.food)}</em></span></div><p class="fc-small" style="margin:4px 0 8px">di food. Fatto da questo telefono stasera: si può associare.</p>
          <label class="fc-check"><input type="checkbox" id="ck-assoc" checked><span class="fc-check-text"><b>Associalo alla tessera</b><small>${o.status === 'paid' ? 'Conta subito.' : 'Conta appena paghi al banco.'}</small></span></label></div>`
        : `<div class="fc-card"><div class="fc-card-head"><span class="fc-card-title">Tessera di <em>novembre</em></span></div>${cardStamps(s, false)}<p class="fc-small" style="text-align:center">Nessun ordine da associare: il primo timbro arriva col prossimo ordine food da ${RULES.VISIT_MIN} €.</p></div>`}
      <div class="fc-cta-row">${assoc ? cta('ASSOCIA E VAI ALLA TESSERA', '', 'assocDone') : cta('VAI ALLA TESSERA', '', 'goTessera')}</div>
      <div class="fc-wrap"><button type="button" class="fc-link" data-go="menu">Torna al menu</button></div></div>`;
  }

  // ---------- TESSERA ----------
  function tessera(s) {
    const why = { ok: ['contata', 'fc-ok'], low: ['sotto 10 € di food', 'fc-ko'], same: ['stessa serata', 'fc-ko'], cancelled: ['annullato', 'fc-ko'], pending: ['in attesa pagamento', 'fc-ok'] };
    const pendRows = s.stamps.filter((x) => x.status === 'pending').map((x) => ({ date: x.date, code: x.code, food: s.order?.food || 0, res: 'pending' }));
    const rows = [...pendRows, ...s.visits].map((v) => `<div class="fc-row"><span class="fc-row-date">${v.date}</span><span class="fc-row-main"><b>${v.code}</b> · ${eur(v.food)} di food<small>${dayName(v.date)}</small></span><span class="fc-row-end ${why[v.res][1]}">${v.res === 'ok' ? '✓ ' : v.res === 'pending' ? '… ' : '– '}${why[v.res][0]}</span></div>`).join('');
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Tessera', s.member ? 'home' : 'menu')}
      <div class="fc-card" style="margin-top:18px"><div class="fc-label">Walrus Food Club · Melegnano</div>
        <div class="fc-card-head" style="margin-top:6px"><span class="fc-card-title">2 visite = <em>5 €</em></span><span class="fc-chip fc-chip--line">N.${s.cardNo}</span></div>
        ${cardStamps(s, false)}${timeBar(s)}</div>
      ${availableVoucher(s) ? `<div class="fc-list"><button type="button" class="fc-btn-line" data-go="buoni"><span>Hai un buono da 5 €<small>scade il ${availableVoucher(s).expires}</small></span><span class="fc-strip-arrow">→</span></button></div>` : ''}
      <div class="fc-section"><div class="fc-label">Come funziona</div>
        <p class="fc-p">· ordine food da almeno <b>${RULES.VISIT_MIN} €</b>, pagato online o al banco<br>· in due serate diverse (la serata finisce alle 06:00)<br>· entro <b>30 giorni</b> dalla prima visita<br>· il buono vale 30 giorni, su un ordine food da ${RULES.REDEEM_MIN} €</p></div>
      <div class="fc-section"><div class="fc-label">Le tue visite</div></div>
      ${rows ? `<div class="fc-rows">${rows}</div>` : `<div class="fc-empty"><img src="${A.IMG_CHEF}" alt=""><b>Ancora nessuna visita</b><p class="fc-small">Il primo ordine food da ${RULES.VISIT_MIN} € fa timbro.</p></div>`}
      <div class="fc-cta-row">${cta('ORDINA ORA', '', 'goMenu')}</div></div>`;
  }

  // ---------- BUONI ----------
  function buoni(s) {
    const disp = s.vouchers.filter((v) => v.status === 'available' || v.status === 'reserved');
    const used = s.vouchers.filter((v) => v.status === 'used');
    const exp = s.vouchers.filter((v) => v.status === 'expired');
    const segBtn = (k, label, n) => `<button type="button" class="cx-where-btn${s.seg === k ? ' cx-where-btn--on' : ''}" aria-pressed="${s.seg === k}" data-seg="${k}"><span class="cx-where-text"><span class="cx-where-title">${label} ${n}</span></span></button>`;
    const list = s.seg === 'disp' ? disp : s.seg === 'usati' ? used : exp;
    const toNext = 2 - s.stamps.filter((x) => x.status === 'ok').length;
    const empty = {
      disp: `<div class="fc-empty"><img src="${A.IMG_CHEF}" alt=""><b>Nessun buono, per ora</b><p class="fc-small">Ti ${toNext === 1 ? 'manca 1 visita' : 'mancano ' + toNext + ' visite'} per il prossimo.</p><button type="button" class="fc-link" data-go="tessera">Vedi la tessera</button></div>`,
      usati: `<div class="fc-empty"><b>Ancora niente</b><p class="fc-small">Qui finiscono i buoni che hai già mangiato.</p></div>`,
      scad: `<div class="fc-empty"><b>Nessun buono scaduto</b><p class="fc-small">Ottimo lavoro.</p></div>`,
    }[s.seg];
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('I miei buoni', s.member ? 'home' : 'menu')}
      <div class="fc-seg" role="group" aria-label="Filtra buoni">${segBtn('disp', 'Validi', disp.length)}${segBtn('usati', 'Usati', used.length)}${segBtn('scad', 'Scaduti', exp.length)}</div>
      ${list.length ? list.map((v) => voucherEl(v, true)).join('') : empty}
      <div class="fc-section"><p class="fc-small">Un buono per ordine, solo sul food ordinato con Walbox al Walrus di Melegnano. Non è convertibile in denaro e non dà resto. Si usa nel sacco, prima di scegliere come pagare.</p></div></div>`;
  }

  // ---------- HOME ----------
  function home(s) {
    const v = availableVoucher(s);
    const ok = s.stamps.filter((x) => x.status === 'ok').length;
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Food Club')}
      <header class="kp-head fc-head"><div class="kp-kicker">Walrus Food Club</div><h1 class="kp-title">CIAO, <em>${esc(s.name.toUpperCase())}.</em></h1></header>
      ${v ? voucherEl(v, true) : ''}
      <button type="button" class="fc-card fc-card-link" style="width:calc(100% - 32px)" data-go="tessera"><div class="fc-card-head"><span class="fc-card-title">Tessera <em>n.${s.cardNo}</em></span><span class="fc-strip-arrow">→</span></div>${cardStamps(s, true)}<div class="fc-small" style="text-align:center">${ok === 0 ? 'Il prossimo ordine food da 10 € fa timbro.' : 'Ancora 1 visita entro il ' + addDays(s.stamps[0].date, RULES.WINDOW)}</div></button>
      <div class="fc-section"><div class="fc-label">Campagna di novembre</div><p class="fc-p">2 visite food in 30 giorni = 5 € di buono.</p></div>
      <div class="fc-list"><button type="button" class="fc-btn-line" data-go="buoni"><span>I miei buoni<small>${s.vouchers.length} in tutto</small></span><span class="fc-strip-arrow">→</span></button>
        <button type="button" class="fc-btn-line" data-go="amici"><span>Porta un amico<small>5 € quando fa il primo ordine</small></span><span class="fc-strip-arrow">→</span></button>
        <button type="button" class="fc-btn-line" data-go="prefs"><span>Notifiche e privacy<small>${s.push ? 'notifiche attive' : 'notifiche spente'} · promo ${s.marketing ? 'sì' : 'no'}</small></span><span class="fc-strip-arrow">→</span></button></div>
      <div class="fc-cta-row">${cta('ORDINA ORA', '', 'goMenu')}</div></div>`;
  }

  // ---------- AMICI ----------
  function amici(s) {
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Porta un amico', 'home')}
      <header class="kp-head fc-head"><div class="kp-kicker">Food Club · inviti</div><h1 class="kp-title">PORTALO A <em>MANGIARE.</em></h1><p class="kp-sub">Quando il tuo amico fa il primo ordine food pagato, tu ricevi un buono da 5 €.</p></header>
      <div class="fc-card"><div class="fc-label">Il tuo codice</div>
        <div class="fc-code"><div><b>ANNA-7K</b><small>walrus.walbox.app/kitchen/club?amico=ANNA-7K</small></div></div>
        <div class="fc-two">${cta('CONDIVIDI', '', 'share')}<button type="button" class="fc-btn-ghost" data-act="copy">COPIA</button></div></div>
      <div class="fc-kpis"><div class="fc-kpi"><b>3</b><span>iscritti</span></div><div class="fc-kpi"><b>1</b><span>hanno ordinato</span></div><div class="fc-kpi"><b>5 €</b><span>guadagnati</span></div></div>
      <div class="fc-section"><div class="fc-label">I tuoi inviti</div></div>
      <div class="fc-rows">
        <div class="fc-row"><span class="fc-row-date">15/11</span><span class="fc-row-main"><b>L.</b> ha ordinato<small>primo ordine food pagato</small></span><span class="fc-row-end fc-ok">✓ +5 €</span></div>
        <div class="fc-row"><span class="fc-row-date">14/11</span><span class="fc-row-main"><b>M.</b> iscritto<small>deve ancora fare il primo ordine</small></span><span class="fc-row-end fc-ko">in attesa</span></div>
        <div class="fc-row"><span class="fc-row-date">14/11</span><span class="fc-row-main"><b>G.</b> iscritto<small>deve ancora fare il primo ordine</small></span><span class="fc-row-end fc-ko">in attesa</span></div></div>
      <div class="fc-section"><div class="fc-label">Regole</div><p class="fc-small">Vale per numeri mai iscritti prima. Il primo ordine dell’amico deve avere almeno ${RULES.VISIT_MIN} € di food ed essere pagato. Non vale sullo stesso telefono. Massimo 5 premi al mese. Il tuo amico entra nel Club gratis come tutti. <i>(Vantaggio per l’amico: da decidere.)</i></p></div></div>`;
  }

  // ---------- PREFERENZE ----------
  function prefs(s) {
    const sw = (k, on, dis) => `<button type="button" class="fc-switch" role="switch" aria-checked="${on}" data-sw="${k}" ${dis ? 'disabled' : ''} aria-label="${k}"></button>`;
    return `<div class="kitch-page kitch-page--poster fc-page">${topbar('Preferenze', 'home')}
      <div class="fc-section"><div class="fc-label">Avvisi sull’ordine</div>
        <div class="fc-toggle-row"><div><b>Notifiche su questo telefono</b><small>“È pronto!”, timbri e buoni. Su iPhone servono Walbox sulla schermata Home.</small></div>${sw('push', s.push)}</div></div>
      <div class="fc-section"><div class="fc-label">Promo e novità · facoltativo</div>
        <div class="fc-toggle-row"><div><b>Consenso marketing</b><small>${s.marketing ? 'Dato il 06/11/2026 alle 21:40. ' : ''}Solo notifiche e messaggi dentro Walbox. Niente SMS promozionali.</small></div>${sw('marketing', s.marketing)}</div>
        <div class="fc-toggle-row"><div><b>SMS</b><small>Solo per il codice di accesso. Mai promozioni.</small></div><span class="fc-chip fc-chip--line">SOLO CODICE</span></div></div>
      <div class="fc-section"><div class="fc-label">Messaggi</div></div>
      <div class="fc-rows">${s.messages.map((m) => `<div class="fc-row"><span class="fc-row-date">${m.date}</span><span class="fc-row-main">${esc(m.text)}</span><span></span></div>`).join('')}</div>
      <div class="fc-section"><button type="button" class="fc-link">Informativa privacy del Food Club</button><br><button type="button" class="fc-link fc-link--muted">Esci da questo telefono</button><br><button type="button" class="fc-link fc-link--danger">Cancella la tessera e i miei dati</button>
      <p class="fc-small">Cancellando perdi i buoni non usati. Gli ordini restano nei registri contabili come previsto dalla legge.</p></div></div>`;
  }

  // ---------- SUMUP simulato ----------
  function sumup(s) {
    return `<div class="fc-sumup"><h2>Pagamento SumUp (simulato)</h2><p>Importo: <b>${eur(s.order.total)}</b>${s.order.discount ? ' · buono Club già scalato' : ''}</p>
      <button data-act="sumupOk">Paga ${eur(s.order.total)}</button><button class="alt" data-act="sumupCancel">Non pago · dopo 5 minuti l’ordine si annulla</button></div>`;
  }

  // ---------- STAFF ----------
  function staff(s) {
    const tab = (k, l) => `<button type="button" class="kpd-sumup-badge kpd-sumup-badge--neutral${s.staffTab === k ? ' kpd-sumup-badge--active' : ''}" data-stab="${k}">${l}</button>`;
    const kpi = (l, v, c, sub) => `<div class="kpd-cash-tile"><span class="kpd-cash-label">${l}</span><span class="kpd-cash-value" style="color:${c}">${v}</span>${sub ? `<span style="font-size:12px;color:#8fa2b5;margin-top:2px">${sub}</span>` : ''}</div>`;
    const bars = (rows, unit = '') => { const max = Math.max(...rows.map((r) => r[1])); return `<div class="kpd-category-chart">${rows.map((r) => `<div class="kpd-category-row"><span class="kpd-category-label">${r[0]}</span><div class="kpd-category-track"><div class="kpd-category-bar" style="width:${(r[1] / max) * 100}%"></div></div><span class="kpd-category-qty">${r[1]}${unit}</span></div>`).join('')}</div>`; };
    const sec = (t, body) => `<div class="kpd-section-title" style="margin-top:20px">${t}</div>${body}`;
    const table = (head, rows) => `<div class="fc-staff-table"><div class="fc-staff-tr fc-staff-th">${head.map((h) => `<span>${h}</span>`).join('')}</div>${rows.map((r) => `<div class="fc-staff-tr">${r.map((c) => `<span>${c}</span>`).join('')}</div>`).join('')}</div>`;
    const kpis = `<div class="kpd-kpi-grid fc-staff-kpis">${kpi('Iscritti', '86', '#e8eef5', '+23 negli ultimi 7 giorni')}${kpi('Visite riconosciute', '141', '#4ade80', '3 in attesa di pagamento al banco')}${kpi('Buoni emessi', '38', '#eab308')}${kpi('Buoni utilizzati', '21', '#4ade80', '55% degli emessi')}${kpi('Clienti da invito', '9', '#60a5fa', 'con primo ordine pagato')}${kpi('Costo promo', '150,00 €', '#ff6b1a', '21 buoni + 9 premi invito')}</div>`;
    let body = '';
    if (s.staffTab === 'panoramica') {
      body = kpis + sec('Visite riconosciute per serata', bars([['ven 06/11', 31], ['sab 07/11', 27], ['dom 08/11', 9], ['gio 12/11', 14], ['ven 13/11', 36], ['sab 14/11', 24]]))
        + sec('Da tenere d’occhio', `<div class="kpd-attention-badges"><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Buoni in scadenza (7 gg)</span><span class="kpd-attention-badge-value">6</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Timbri in attesa pagamento</span><span class="kpd-attention-badge-value">3</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Buoni riservati</span><span class="kpd-attention-badge-value">1</span></div></div>`);
    } else if (s.staffTab === 'campagna') {
      body = `<div class="fc-staff-note"><b>CAMPAGNA ATTIVA · 2 visite = 5 €</b> · 06/11 → 05/12 · food ≥ 10 € per visita · buono su food ≥ 12 € · validità 30 gg<br>Gestita dall’amministratore: da qui non si modifica nulla.</div>`
        + sec('Risultati della campagna', bars([['Iscritti', 86], ['Con 1 timbro', 61], ['Tessera completata', 38], ['Buono utilizzato', 21], ['Buono scaduto', 2]]))
        + sec('Ritorno', `<div class="kpd-kpi-grid fc-staff-kpis">${kpi('Iscritti tornati 2ª sera', '44%', '#4ade80', '38 su 86')}${kpi('Giorni tra le visite', '8', '#e8eef5', 'mediana')}${kpi('Food medio con buono', '17,40 €', '#eab308', 'prima dello sconto')}</div><p class="fc-staff-help">Numeri descrittivi sugli iscritti: senza un gruppo di confronto non dicono quanti ritorni ha "creato" il Club.</p>`);
    } else if (s.staffTab === 'buoni') {
      body = `<div class="kpd-attention-badges"><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Emessi</span><span class="kpd-attention-badge-value">38</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Validi</span><span class="kpd-attention-badge-value">14</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Riservati</span><span class="kpd-attention-badge-value">1</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Utilizzati</span><span class="kpd-attention-badge-value">21</span></div><div class="kpd-attention-badge"><span class="kpd-attention-badge-label">Scaduti</span><span class="kpd-attention-badge-value">2</span></div></div>`
        + sec('Ultimi buoni', table(['Codice', 'Cliente', 'Emesso', 'Scade', 'Stato', 'Ordine'], [
          ['WFC-7KQ2', 'Anna ••• 4821', '13/11', '13/12', '<span class="fc-staff-pill fc-staff-pill--y">RISERVATO</span>', 'W31 · da pagare'],
          ['WFC-3HD8', 'Luca ••• 1170', '12/11', '12/12', '<span class="fc-staff-pill fc-staff-pill--g">USATO</span>', 'W08 · −5,00 €'],
          ['WFC-9TZ1', 'Sara ••• 0932', '08/11', '08/12', '<span class="fc-staff-pill">VALIDO</span>', '—'],
          ['WFC-2M9P', 'Marco ••• 5521', '01/10', '31/10', '<span class="fc-staff-pill fc-staff-pill--r">SCADUTO</span>', '—']]))
        + `<p class="fc-staff-help">Sola lettura. Il buono si scala da solo nell’ordine: lo staff vede "BUONO −5 €" sulla comanda e incassa il totale già scontato.</p>`;
    } else if (s.staffTab === 'iscritti') {
      body = `<div class="kpd-kpi-grid fc-staff-kpis">${kpi('Iscritti', '86', '#e8eef5')}${kpi('Attivi 30 gg', '71', '#4ade80', 'almeno 1 visita')}${kpi('Consenso promo', '52%', '#eab308', '45 su 86')}</div>`
        + sec('Da dove arrivano', bars([['Dopo l’ordine', 51], ['Dal menu', 21], ['Da invito', 14]]))
        + sec('Elenco (dati minimi)', table(['Nome', 'Telefono', 'Iscritto', 'Tessera', 'Ultima visita', 'Promo'], [
          ['Anna', '••• 4821', '06/11', '2/2 · buono', '13/11', 'no'], ['Luca', '••• 1170', '06/11', '1/2', '12/11', 'sì'], ['Sara', '••• 0932', '07/11', '0/2', '—', 'sì']]));
    } else {
      body = `<div class="kpd-kpi-grid fc-staff-kpis">${kpi('Link condivisi', '31', '#e8eef5')}${kpi('Iscritti da invito', '14', '#60a5fa')}${kpi('Clienti acquisiti', '9', '#4ade80', 'primo ordine food pagato')}</div>`
        + sec('Funnel inviti', bars([['Link condivisi', 31], ['Iscritti', 14], ['Primo ordine pagato', 9], ['Premi a chi invita', 9]]))
        + sec('Chi invita di più', table(['Cliente', 'Invitati', 'Hanno ordinato', 'Premi'], [['Anna ••• 4821', '3', '1', '5 €'], ['Luca ••• 1170', '2', '2', '10 €']]));
    }
    return `<div class="kss-page fc-staff"><div class="kss-overlay kss-overlay--fullscreen"><div class="kss-overlay-panel"><div class="kss-overlay-head"><span>CLUB</span><button class="kss-overlay-close" data-go="menu">CHIUDI ✕</button></div>
      <div class="kss-overlay-body"><div class="kpd-filter-group fc-staff-tabs"><span class="kpd-filter-label">Vista</span>${tab('panoramica', 'PANORAMICA')}${tab('campagna', 'CAMPAGNA')}${tab('buoni', 'BUONI')}${tab('iscritti', 'ISCRITTI')}${tab('inviti', 'INVITI')}</div>
      <div class="kpd-filter-group"><span class="kpd-filter-label">Periodo</span><button type="button" class="kpd-sumup-badge kpd-sumup-badge--neutral kpd-sumup-badge--active">ULTIMI 30 GIORNI</button><span class="fc-staff-sample">DATI DI ESEMPIO · SOLA LETTURA</span></div>
      ${body}</div></div></div></div>`;
  }

  // ---------- render ----------
  const SCENES = { menu: menuScene, status: statusScene, club: (s) => (s.member ? home(s) : clubIntro(s)), home, join1, join2, join3, tessera, buoni, amici, prefs, sumup, staff };
  const root = document.getElementById('app');
  let toastMsg = null;
  function toast(m) { toastMsg = m; }
  function render() {
    const fn = SCENES[S.scene] || menuScene;
    root.innerHTML = fn(S) + (toastMsg ? `<div class="fc-toast" role="status">${toastMsg}</div>` : '') + proto();
    toastMsg = null;
    S.justStamped = false;
    document.body.classList.toggle('fc-body-staff', S.scene === 'staff');
    if (S.scene === 'join2') startTimer();
  }
  function go(scene) { S.cats = false; if (scene !== 'menu') S.cartOpen = false; S.scene = scene; window.scrollTo(0, 0); render(); }

  // ---------- pannello prototipo ----------
  let panelOpen = false;
  function proto() {
    const groups = [
      ['Percorso cliente (1 → 9)', ['p1', 'p1cats', 'p2', 'p2a', 'p2b', 'p2c', 'p3', 'p4cart', 'p4pcp', 'p4paid', 'p4tess', 'p5cart', 'p5paid', 'p6', 'p6home', 'p6menu', 'p7low', 'p7on', 'p8online', 'p8pcp', 'p9']],
      ['Casi particolari', ['cNoStamp', 'cSame', 'cLow', 'cExpired', 'cExpMenu', 'cCancel', 'cCancel2', 'cReserved', 'cGuest', 'cGuestJoin', 'cOtp', 'cPhone', 'prefs']],
      ['Staff · CLUB', ['staff', 'staffCamp', 'staffBuoni', 'staffIsc', 'staffInv']],
    ];
    const btn = `<button type="button" class="proto-fab" data-act="proto">☰ PROTOTIPO</button>`;
    if (!panelOpen) return btn;
    return btn + `<div class="proto-panel" data-act="protoClose"><div class="proto-panel-in" data-stop="1"><button class="proto-close" data-act="protoClose">Chiudi</button>
      <p style="font-size:12px;color:#aaa">Prototipo Walrus Food Club · dati finti · nessuna chiamata di rete. Ogni voce ricarica uno stato coerente.</p>
      ${groups.map(([g, ks]) => `<h3>${g}</h3>${ks.map((k) => `<button data-preset="${k}">${PRESETS[k].t}<small>${PRESETS[k].d}</small></button>`).join('')}`).join('')}
      <h3>Ricomincia</h3><button data-preset="p1">Azzera tutto</button></div></div>`;
  }
  function applyPreset(k) { S = base(); PRESETS[k].f(S); panelOpen = false; history.replaceState(null, '', '#' + k); window.scrollTo(0, 0); render(); }

  // ---------- eventi ----------
  const CARD_PRODUCTS = { 'Pulled Pork': 'pulled', Pastrami: 'pastrami' };
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-go],[data-inc],[data-dec],[data-pay],[data-seg],[data-preset],[data-stab],[data-sw],.pc-card button');
    if (!t) return;
    if (t.dataset.stop && !e.target.closest('[data-act],[data-preset]')) return;
    const d = t.dataset;
    if (d.preset) return applyPreset(d.preset);
    if (d.go) {
      if (d.go === 'join1') { S.joinFrom = S.scene === 'status' ? 'status' : 'menu'; }
      return go(d.go);
    }
    if (d.inc) { const l = S.cart.find((x) => x.k === d.inc); if (l) l.q++; else S.cart.push({ k: d.inc, q: 1 }); if (!canRedeem(S)) S.applied = false; return render(); }
    if (d.dec) { const l = S.cart.find((x) => x.k === d.dec); if (l) l.q--; S.cart = S.cart.filter((x) => x.q > 0); if (S.applied && !canRedeem(S)) { S.applied = false; toastMsg = 'Buono tolto: il food è sceso sotto 12 €'; } if (!S.cart.length) S.cartOpen = false; return render(); }
    if (d.pay) { createOrder(S, d.pay); return go(d.pay === 'online' ? 'sumup' : 'status'); }
    if (d.seg) { S.seg = d.seg; return render(); }
    if (d.stab) { S.staffTab = d.stab; return render(); }
    if (d.sw) { if (d.sw === 'push') S.push = !S.push; else S.marketing = !S.marketing; return render(); }
    if (t.matches('.pc-card button')) {
      const name = t.closest('.pc-card').querySelector('.pc-name')?.textContent.trim();
      const k = CARD_PRODUCTS[name]; if (k) { const l = S.cart.find((x) => x.k === k); if (l) l.q++; else S.cart.push({ k, q: 1 }); toastMsg = name.toUpperCase() + ' aggiunto al sacco ✓'; }
      return render();
    }
    const a = d.act;
    switch (a) {
      case 'openCats': S.cats = true; return render();
      case 'closeCats': S.cats = false; return render();
      case 'closeCatsBg': if (e.target === t) { S.cats = false; render(); } return;
      case 'openCart': S.cartOpen = true; return render();
      case 'closeCart': S.cartOpen = false; return render();
      case 'closeStrip': S.stripClosed = true; return render();
      case 'goJoin': S.joinFrom = 'menu'; return go('join1');
      case 'joinFromStatus': S.joinFrom = 'status'; return go('join1');
      case 'notNow': S.order = { ...S.order, hideInvite: true }; toastMsg = 'Ok! Il Club resta nel menu ☰'; return go('menu');
      case 'sendCode': {
        S.phone = document.getElementById('ph').value; S.privacy = document.getElementById('ck-priv').checked; S.marketing = document.getElementById('ck-mkt').checked;
        const digits = S.phone.replace(/\D/g, '');
        S.joinErr = digits.length < 9 || digits.length > 10 ? 'phone' : !S.privacy ? 'privacy' : '';
        if (S.joinErr) return render();
        S.otpErr = false; return go('join2');
      }
      case 'verify': {
        const code = [...document.querySelectorAll('[data-otp]')].map((i) => i.value).join('');
        if (code === '000000') { S.otpErr = true; return render(); }
        const keepMk = S.marketing; makeMember(S); S.marketing = keepMk; return go('join3');
      }
      case 'assocDone': {
        const o = S.order; const assoc = document.getElementById('ck-assoc')?.checked;
        if (o && assoc && o.food >= RULES.VISIT_MIN) { o.stamp = 'ok'; S.stamps.push({ date: o.night, code: o.code, status: o.status === 'paid' ? 'ok' : 'pending' }); if (o.status === 'paid') S.visits.unshift({ date: o.night, code: o.code, food: o.food, res: 'ok' }); }
        return go('tessera');
      }
      case 'goTessera': return go('tessera');
      case 'goBuoni': S.seg = 'disp'; return go('buoni');
      case 'goMenu': return go('menu');
      case 'useVoucher': S.applied = true; if (S.cart.length) { S.cartOpen = true; } else { toastMsg = 'Riempi il sacco: il buono ti aspetta lì'; } return go('menu');
      case 'toggleVoucher': S.applied = !S.applied; toastMsg = S.applied ? 'Buono applicato: −5,00 € ✓' : null; return render();
      case 'dismissExpired': S.vouchers.forEach((v) => { v.notice = false; }); return render();
      case 'staffPaid': settle(S, false); return render();
      case 'staffCancel': release(S, 'cancelled'); return render();
      case 'sumupOk': settle(S, false); return go('status');
      case 'sumupCancel': release(S, 'cancelled'); return go('status');
      case 'nextNight': S.night = addDays(S.night, 7); S.order = null; S.cart = []; toastMsg = 'È un’altra sera: ' + dayName(S.night) + ' ' + S.night; return go('menu');
      case 'share': if (navigator.share) { navigator.share({ title: 'Walrus Food Club', text: 'Vieni al Walrus: codice ANNA-7K', url: 'https://walrus.walbox.app/kitchen/club?amico=ANNA-7K' }).catch(() => {}); } else { toastMsg = 'Link copiato ✓'; render(); } return;
      case 'copy': try { navigator.clipboard?.writeText('https://walrus.walbox.app/kitchen/club?amico=ANNA-7K'); } catch (_) { /* ok */ } toastMsg = 'Link copiato ✓'; return render();
      case 'proto': panelOpen = true; return render();
      case 'protoClose': if (e.target === t || t.classList.contains('proto-close')) { panelOpen = false; render(); } return;
      default: return;
    }
  });
  root.addEventListener('input', (e) => {
    const i = e.target.closest('[data-otp]'); if (!i) return;
    i.value = i.value.replace(/\D/g, '').slice(0, 1);
    if (i.value) i.nextElementSibling?.focus();
  });
  let timerId = null;
  function startTimer() {
    clearInterval(timerId); let n = 42;
    timerId = setInterval(() => { const el = document.getElementById('otp-timer'); if (!el) return clearInterval(timerId); n--; el.innerHTML = n > 0 ? `Puoi richiederlo di nuovo tra 0:${String(n).padStart(2, '0')}` : '<button type="button" class="fc-link">Rimanda il codice</button>'; if (n <= 0) clearInterval(timerId); }, 1000);
  }

  // avvio: #preset nell'URL (usato per gli screenshot), ?clean=1 nasconde gli strumenti del prototipo
  if (new URLSearchParams(location.search).get('clean') === '1') document.documentElement.classList.add('proto-clean');
  const h = location.hash.slice(1);
  if (PRESETS[h]) { PRESETS[h].f(S); }
  render();
})();
</script>
</body>
